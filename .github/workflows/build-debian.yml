name: Build Debian Package

on:
  workflow_call:
    inputs:
      build-ref:
        description: Commit selected by the package release workflow
        required: true
        type: string
      publish-release:
        description: Attach packages to the selected version's release
        required: true
        type: boolean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian-build:
    runs-on: ubuntu-latest
    container:
      image: linuxmintd/lmde7-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build-ref || github.ref }}

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python equivs \
            meson ninja-build pkgconf intltool itstool cmake curl ca-certificates \
            libgtk-3-dev libglib2.0-dev libjson-glib-dev \
            libx11-dev libxapp-dev libcinnamon-desktop-dev \
            libexif-dev libraw-dev libexempi-dev libebur128-dev libgstreamer1.0-dev \
            libepoxy-dev libopengl-dev libgl-dev libegl-dev libgl1-mesa-dri \
            libgstreamer-plugins-base1.0-dev libgsf-1-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            pulseaudio gstreamer1.0-pulseaudio \
            gobject-introspection libgirepository1.0-dev \
            gir1.2-gio-2.0-dev gir1.2-gtk-3.0-dev \
            gtk-doc-tools cinnamon-l10n libgtk-layer-shell-dev \
            libpango1.0-dev libatk1.0-dev libgail-3-dev \
            libxext-dev libxrender-dev libwayland-dev \
            python3 python3-gi x11proto-dev \
            dbus-daemon gvfs xvfb xauth weston libarchive-dev libarchive-tools libsqlite3-dev \
            libisofs-dev xorriso \
            libmd4c-dev libmd4c-html0-dev libpoppler-glib-dev mupdf-tools bubblewrap

      - name: Build and install pinned projectM 4 dependency packages
        run: |
          sh debian/build-projectm-packages.sh projectm-debian
          dpkg -i projectm-debian/*.deb
          pkg-config --atleast-version=4.1 projectM-4

      - name: Build Debian package
        run: |
          for option in ${DEB_BUILD_OPTIONS:-} ${DEB_BUILD_PROFILES:-}; do
            if [ "$option" = nocheck ]; then
              echo "Release builds must run the copy/move safety regressions." >&2
              exit 1
            fi
          done
          VERSION=$(grep -Po "version\s*:\s*'\K[^']+" meson.build | head -n1)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          useradd -m builder
          # Keep transfer fixtures on the host filesystem, not container overlayfs.
          BUILD_ROOT=$(mktemp -d "$(dirname "$PWD")/nemo-debian-build.XXXXXX")
          mkdir "$BUILD_ROOT/source"
          tar --exclude=./projectm-debian --exclude=./build -cf - . | tar -xf - -C "$BUILD_ROOT/source"
          DEBIAN_VERSION=$(dpkg-parsechangelog --show-field Version)
          DEBEMAIL=smpl-os@users.noreply.github.com DEBFULLNAME=smpl-os \
            dch --changelog "$BUILD_ROOT/source/debian/changelog" \
              --newversion "${DEBIAN_VERSION}+smpl${VERSION}" \
              --distribution stable --force-distribution "smplOS Nemo ${VERSION} release."
          chown -R builder:builder "$BUILD_ROOT"
          runuser -u builder -- sh -c \
            'cd "$1" && dpkg-buildpackage -us -uc -b' sh "$BUILD_ROOT/source"

          mkdir -p debian-build
          cp projectm-debian/*.deb projectm-debian/libprojectM-*.tar.gz debian-build/
          cp "$BUILD_ROOT"/nemo_*_amd64.deb "debian-build/nemo-smpl_${VERSION}_amd64.deb"
          cp "$BUILD_ROOT"/nemo-data_*_all.deb "debian-build/nemo-smpl-data_${VERSION}_all.deb"
          cp "$BUILD_ROOT"/libnemo-extension1_*_amd64.deb \
             "$BUILD_ROOT"/libnemo-extension-dev_*_amd64.deb \
             "$BUILD_ROOT"/gir1.2-nemo-3.0_*_amd64.deb debian-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nemo-smpl-debian
          path: |
            debian-build/*.deb
            debian-build/libprojectM-*.tar.gz
          retention-days: 14

      - name: Add to GitHub Release
        if: inputs.publish-release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            debian-build/*.deb
            debian-build/libprojectM-*.tar.gz
          tag_name: v${{ env.VERSION }}
          name: nemo-smpl ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
